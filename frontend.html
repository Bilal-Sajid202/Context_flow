<!DOCTYPE html>
<html>
<head>
    <title>Qdrant Data</title>
</head>
<body>
    <h1>Stored Documents</h1>
    <div id="content"></div>

    <script>
        fetch('http://localhost:8000/data')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('content');
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <h2>${item.heading}</h2>
                        ${item.image ? `<img src="${item.image}" width="200" />` : ''}
                        <p>${item.text}</p>
                        <hr />
                    `;
                    container.appendChild(div);
                });
            });
    </script>
</body>
</html>
