<!DOCTYPE html>
<html>
<head>
    <title>Qdrant Data</title>
</head>
<body>
    <h1>Upload Excel File</h1>
    <form action="/upload-excel" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".xlsx,.xls" required>
        <button type="submit">Upload</button>
    </form>

    <h1>Stored Documents</h1>
    
    <div>
        <input type="text" id="searchInput" placeholder="Search query...">
        <button onclick="searchData()">Search</button>
        <button onclick="loadData()">Refresh All</button>
    </div>

    <div id="content"></div>

    <script>
        function displayResults(data) {
            const container = document.getElementById('content');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<p>No results found.</p>';
                return;
            }

            data.forEach(item => {
                // Handle both raw payload (from /data) and search result structure (from /query)
                const payload = item.payload || item;
                const score = item.score ? `<small>Score: ${item.score.toFixed(4)}</small><br>` : '';
                
                const div = document.createElement('div');
                div.innerHTML = `
                    <h2>${payload.heading}</h2>
                    ${score}
                    ${payload.image ? `<img src="${payload.image}" width="200" />` : ''}
                    <p>${payload.text}</p>
                    <hr />
                `;
                container.appendChild(div);
            });
        }

        function searchData() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            fetch(`/query?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => displayResults(data))
                .catch(err => console.error('Error:', err));
        }

        function loadData() {
            fetch('/data')
                .then(res => res.json())
                .then(data => displayResults(data))
                .catch(err => console.error('Error:', err));
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
